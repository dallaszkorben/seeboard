[gps]
show_dms_decimals = False
coord_font_size = 103
coord_color = lime
meta_font_size = 18
meta_color = cyan

[cam]
rotation = 180

[coords]
fix_color = lime
nofix_color = yellow
error_color = red
bg_color = black
bg_brightness = 40

[route_recording]
sampling_mode = distance
distance_threshold = 15.0
time_threshold = 10
line_color = RED
line_width = 3
line_style = continuous
point_color = red
point_diameter = 8

[camera_rotations]
esp32-cam-93d0._mjpeg._tcp.local. = 180
esp32-cam-f404._mjpeg._tcp.local. = 180

[camera_settings]
label_font_size = 16
label_color = white

[map]
time_based_sampling = 15s
recording_color = BLUE
position_radius = 7
position_font_size = 10
path_width = 6

[database]
path = ~/.seeboard/seeboard.db

